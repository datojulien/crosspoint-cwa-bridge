[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crosspoint-cwa-bridge"
version = "0.7.1"
description = "A stateless CrossPoint-specific OPDS bridge for Calibre-Web-Automated"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Julien Pierre"}]
keywords = ["calibre-web-automated", "crosspoint", "epub", "opds", "raspberry-pi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Framework :: AsyncIO",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "aiohttp==3.14.3",
  "lxml==6.1.2",
  "Pillow==12.3.0",
]

[project.urls]
Homepage = "https://github.com/datojulien/crosspoint-cwa-bridge"
Documentation = "https://github.com/datojulien/crosspoint-cwa-bridge#readme"
Issues = "https://github.com/datojulien/crosspoint-cwa-bridge/issues"
Source = "https://github.com/datojulien/crosspoint-cwa-bridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crosspoint_cwa_bridge = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
