name: Bug report
description: Report reproducible bridge behavior using sanitized details.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Never include passwords, authorization headers, private URLs, client
        addresses, book metadata, cache keys, TLS private keys, or state files.
  - type: input
    id: version
    attributes:
      label: Bridge version
      placeholder: 0.7.0
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [ARM64, x86_64, Other]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the result without private library or account data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
